    <g font-family="ui-monospace, Consolas, monospace" font-size="12.5">
      <text x="404" y="238" fill="#5c6170">1</text><text x="440" y="238" fill="#cba6ff">import</text><text x="492" y="238" fill="#9aa0ac"> { AppError } </text><text x="640" y="238" fill="#cba6ff">from</text><text x="672" y="238" fill="#9fd8a6">"@/shared/contracts/api-error"</text><text x="910" y="238" fill="#9aa0ac">;</text>
      <text x="404" y="260" fill="#5c6170">2</text>
      <text x="404" y="282" fill="#5c6170">3</text><text x="440" y="282" fill="#6d7383">// Reject traversal, absolute, and drive-letter paths.</text>
      <text x="404" y="304" fill="#5c6170">4</text><text x="440" y="304" fill="#cba6ff">export function</text><text x="560" y="304" fill="#85c8ff">validateArchivePath</text><text x="700" y="304" fill="#9aa0ac">(entry: </text><text x="772" y="304" fill="#6fe0c8">string</text><text x="824" y="304" fill="#9aa0ac">): </text><text x="844" y="304" fill="#6fe0c8">string</text><text x="908" y="304" fill="#9aa0ac"> {</text>
      <text x="404" y="326" fill="#5c6170">5</text><text x="456" y="326" fill="#cba6ff">const</text><text x="504" y="326" fill="#9aa0ac"> normalized = </text><text x="664" y="326" fill="#85c8ff">normalize</text><text x="744" y="326" fill="#9aa0ac">(entry);</text>
      <text x="404" y="348" fill="#5c6170">6</text><text x="456" y="348" fill="#cba6ff">if</text><text x="488" y="348" fill="#9aa0ac"> (normalized.</text><text x="600" y="348" fill="#85c8ff">startsWith</text><text x="688" y="348" fill="#9aa0ac">(</text><text x="700" y="348" fill="#9fd8a6">".."</text><text x="724" y="348" fill="#9aa0ac">) || /^[A-Za-z]:/.test(entry)) {</text>
      <text x="404" y="370" fill="#5c6170">7</text><text x="472" y="370" fill="#cba6ff">throw new</text><text x="560" y="370" fill="#6fe0c8">AppError</text><text x="632" y="370" fill="#9aa0ac">(</text><text x="644" y="370" fill="#9fd8a6">"UNSAFE_ZIP_PATH"</text><text x="790" y="370" fill="#9aa0ac">, </text><text x="802" y="370" fill="#9fd8a6">"Archive contains an unsafe path."</text><text x="1096" y="370" fill="#9aa0ac">);</text>
      <text x="404" y="392" fill="#5c6170">8</text><text x="456" y="392" fill="#9aa0ac">}</text>
      <text x="404" y="414" fill="#5c6170">9</text><text x="456" y="414" fill="#cba6ff">return</text><text x="504" y="414" fill="#9aa0ac"> normalized;</text>
      <text x="404" y="436" fill="#5c6170">10</text><text x="440" y="436" fill="#9aa0ac">}</text>
    </g>

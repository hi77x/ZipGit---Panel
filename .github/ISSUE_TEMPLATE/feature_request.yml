name: Feature request
description: Suggest a capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve? Which workflow is blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import
        - Code explorer and diffs
        - Repo Radar and security
        - Issues and pull requests
        - Actions and Pages
        - Observability and operations
        - Deployment and documentation
        - Other
